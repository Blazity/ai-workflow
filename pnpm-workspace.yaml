packages:
  - "apps/*"
  - "packages/*"

# One version per dependency that more than one workspace project declares.
# scripts/gates/check-deps-consistency.mjs fails when a shared dependency is
# missing from this catalog or is pinned to two different specifiers.
catalog:
  "@octokit/auth-app": ^8.2.0
  "@types/node": ^22.0.0
  tsx: ^4.23.13
  typescript: ^5.8
  yaml: ^2.9.0
  zod: ^3.25.76
  # Not a second zod for product code: the worker bundle resolves one zod for
  # the whole function and traces it from @workflow/core, which is 4.x, so the
  # schema suites re-run against this alias to prove they hold under the version
  # production loads as well as the one pinned above.
  zod4: npm:zod@4.3.6
