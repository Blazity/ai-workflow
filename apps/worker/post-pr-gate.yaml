# Legacy post-PR gate: NEUTRALIZED (AIW-220).
#
# The editable Post-PR review workflow supersedes this gate. Both used to fire
# on the same head SHA, publishing "AI Workflow / code-hygiene" next to
# "AI Workflow / Review", and the gate spent one Claude Haiku call per changed
# file on every bot pull request.
#
# The sentinel base branch below can never match a real ref, so
# checkPostPrGateEligibility returns a verdict before dispatch touches the
# advisory lock, the dedupe row, the gate_current pointer, or start(). See
# docs/plans/2026-08-04-legacy-post-pr-gate-neutralization.md.
#
# Do NOT neutralize by deleting this file: on ENOENT the built-in default in
# src/post-pr-gate/config.ts takes over and the gate is live again. Rollback is
# `git revert` of this commit, then redeploy.
#
# `steps: []` alone is also not enough: eligibility would return null, dispatch
# would take the lock and start a real workflow run for zero steps.
postPrGate:
  runOn:
    botPrsOnly: true
    draftPrs: false
    baseBranches: ["__ai-workflow-gate-disabled__"]
  steps: []
