name: CI

on:
  pull_request:
    branches: [main, dev]
  # Without this, nothing ever ran on main: every recorded run came from a
  # pull request, so the branch the releases are cut from had no signal of its
  # own and a merge could land red without anything turning red afterwards.
  # Pull-request runs test the merge commit against the base at open time, not
  # what main actually became, so they are not a substitute.
  push:
    branches: [main]
  merge_group:
  # Kept so the source gate can be re-run by hand on a branch, which is the
  # only thing this workflow does now: the e2e suites it used to carry live in
  # `e2e.yml`, and the note above the jobs says why.
  workflow_dispatch:

concurrency:
  # Pull-request updates supersede stale checks from the same head branch.
  # Pushes retain an exact-SHA verdict, while merge-queue and manual runs use a
  # unique run/attempt suffix so this outer cancellation can never terminate a
  # secret-bearing E2E job. The E2E jobs have their own cross-workflow queue.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'push' && github.sha || (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && format('{0}-{1}', github.run_id, github.run_attempt) || 'shared' }}
  cancel-in-progress: true

jobs:
  # The source gate is four independent jobs so its verdict arrives in minutes
  # instead of at the end of a serial half hour, plus one aggregate job named
  # `ci` so branch protection still has a single check to require.
  #
  # Each of those four source jobs builds from the checkout alone. None may
  # carry secrets, an `if:`, or `continue-on-error`: a source gate that can be
  # skipped or that can reach a live environment is not a gate.
  # `scripts/ci/ci-workflow.test.ts` holds that line for all of them.
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 to match local dev and the Vercel runtime: the dashboard
          # test script relies on node --test glob patterns (Node 21+).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run gen:blocks --check
      - name: Check diff whitespace
        run: |
          set -euo pipefail
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No usable diff base, skipping git diff --check."
            exit 0
          fi
          git diff --check "$base...HEAD"
      - run: pnpm run typecheck
      - run: pnpm run test:release-notes
      - run: pnpm run test:ci
      - run: pnpm run test:packages
      # The bundle resolves one zod for the whole worker function and traces it
      # from @workflow/core, which is zod 4, while the workspace catalog pins
      # 3.25. These two re-run the schema suites against the version production
      # actually loads, so an API that exists in only one of them fails here
      # rather than on the first request after a deploy.
      - run: pnpm run test:packages:zod4
      - run: pnpm --filter @shared/workflow-graph run test:zod4
      - run: pnpm --filter worker run test:zod4
      - run: pnpm run gates
      - run: pnpm run build:ci

  # 384 worker test files, each paying its own process and module startup, so
  # sharding buys wall-clock that the suite itself cannot give back.
  unit-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports. Stopping the others on the first red hides how
      # much is broken behind whichever shard happened to fail first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run <script> -- --shard=...` does not reach vitest through the
      # script's own `&&` chain: it ran all 386 files. Invoke the binary.
      - run: pnpm --filter worker exec vitest run --shard=${{ matrix.shard }}/4

  # The dashboard runs on node --test, which vitest sharding cannot cover, so it
  # earns its own job rather than sitting on another job's critical path.
  unit-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ai-workflow-dashboard run test

  # Durable-workflow tests. They need their own Workflow SDK builder config,
  # so vitest.config.ts cannot pick them up alongside the rest of the suite.
  workflow-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workflow-sdk

  # Fork pull requests must never reach the secret-bearing `e2e` environment.
  engine-canary:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: e2e
    concurrency:
      group: engine-canary-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 to match local dev and the Vercel runtime: the dashboard
          # test script relies on node --test glob patterns (Node 21+).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select engine canary scope
        id: scope
        run: node --import tsx scripts/ci/engine-canary-scope.ts --base "origin/${{ github.base_ref }}" --head HEAD
      - name: Skip pull request migrations
        if: steps.scope.outputs.migrations == 'true'
        run: |
          set -euo pipefail
          echo "::warning title=engine-canary skipped::the pull request carries a database migration; the canary target shares the production database, so it runs after merge only"
          exit 0
      - name: Validate engine canary target configuration
        id: target
        if: steps.scope.outputs.run == 'true' && steps.scope.outputs.migrations != 'true'
        env:
          ENGINE_CANARY_TARGET: ${{ vars.ENGINE_CANARY_TARGET }}
          ENGINE_CANARY_DB_ENV: ${{ vars.ENGINE_CANARY_DB_ENV }}
          ENGINE_CANARY_DB_FINGERPRINT: ${{ vars.ENGINE_CANARY_DB_FINGERPRINT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ENGINE_CANARY_MCP_CLIENT_ID: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_ID }}
          ENGINE_CANARY_MCP_CLIENT_SECRET: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_SECRET }}
          HARNESS_CANARY_CLAUDE_WORKFLOW_ID: ${{ vars.HARNESS_CANARY_CLAUDE_WORKFLOW_ID }}
          HARNESS_CANARY_CODEX_WORKFLOW_ID: ${{ vars.HARNESS_CANARY_CODEX_WORKFLOW_ID }}
          HARNESS_CANARY_CUSTOM_WORKFLOW_ID: ${{ vars.HARNESS_CANARY_CUSTOM_WORKFLOW_ID }}
          HARNESS_CANARY_TICKET_KEY: ${{ vars.HARNESS_CANARY_TICKET_KEY }}
          HARNESS_CANARY_CUSTOM_PROFILE_ID: ${{ vars.HARNESS_CANARY_CUSTOM_PROFILE_ID }}
          HARNESS_CANARY_CUSTOM_PROFILE_VERSION: ${{ vars.HARNESS_CANARY_CUSTOM_PROFILE_VERSION }}
          HARNESS_CANARY_CUSTOM_SKILL_ARTIFACT_HASH: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_ARTIFACT_HASH }}
          HARNESS_CANARY_CUSTOM_SKILL_NAME: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_NAME }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_OWNER: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_OWNER }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_REPOSITORY: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_REPOSITORY }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_PATH: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_PATH }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_COMMIT_SHA: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_COMMIT_SHA }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED: ${{ vars.NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED }}
          HARNESS_CANARY_TIMEOUT_MS: ${{ vars.HARNESS_CANARY_TIMEOUT_MS }}
          REPLAY_CANARY_LOG_EXPORT_PATH: ${{ vars.REPLAY_CANARY_LOG_EXPORT_PATH }}
          REPLAY_CANARY_LOG_WAIT_MS: ${{ vars.REPLAY_CANARY_LOG_WAIT_MS }}
          REPLAY_CANARY_LOG_SETTLE_MS: ${{ vars.REPLAY_CANARY_LOG_SETTLE_MS }}
          REPLAY_CANARY_LOG_MAX_BYTES: ${{ vars.REPLAY_CANARY_LOG_MAX_BYTES }}
        run: |
          set -euo pipefail
          if [ "$ENGINE_CANARY_TARGET" = "production" ]; then
            echo "::error title=engine-canary configuration::the Vercel production target is forbidden"
            exit 1
          fi
          if [ -z "$ENGINE_CANARY_TARGET" ]; then
            echo "::warning title=engine-canary idle::no custom target declared (repository variable ENGINE_CANARY_TARGET); the behavioural gate is wired but did not run"
            echo "armed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          required=(
            ENGINE_CANARY_DB_ENV
            ENGINE_CANARY_DB_FINGERPRINT
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            ENGINE_CANARY_MCP_CLIENT_ID
            ENGINE_CANARY_MCP_CLIENT_SECRET
            HARNESS_CANARY_CLAUDE_WORKFLOW_ID
            HARNESS_CANARY_CODEX_WORKFLOW_ID
            HARNESS_CANARY_CUSTOM_WORKFLOW_ID
            HARNESS_CANARY_TICKET_KEY
            HARNESS_CANARY_CUSTOM_PROFILE_ID
            HARNESS_CANARY_CUSTOM_PROFILE_VERSION
            HARNESS_CANARY_CUSTOM_SKILL_ARTIFACT_HASH
            HARNESS_CANARY_CUSTOM_SKILL_NAME
            HARNESS_CANARY_CUSTOM_SKILL_SOURCE_OWNER
            HARNESS_CANARY_CUSTOM_SKILL_SOURCE_REPOSITORY
            HARNESS_CANARY_CUSTOM_SKILL_SOURCE_PATH
            HARNESS_CANARY_CUSTOM_SKILL_SOURCE_COMMIT_SHA
            DATABASE_URL
            VERCEL_AUTOMATION_BYPASS_SECRET
            NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED
            HARNESS_CANARY_TIMEOUT_MS
            REPLAY_CANARY_LOG_EXPORT_PATH
            REPLAY_CANARY_LOG_WAIT_MS
            REPLAY_CANARY_LOG_SETTLE_MS
            REPLAY_CANARY_LOG_MAX_BYTES
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error title=engine-canary configuration::missing required names: ${missing[*]}"
            exit 1
          fi
          echo "armed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy engine canary target
        id: deploy
        if: steps.scope.outputs.run == 'true' && steps.target.outputs.armed == 'true'
        env:
          ENGINE_CANARY_TARGET: ${{ vars.ENGINE_CANARY_TARGET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deployment_output="$(npx --yes vercel@56.4.1 deploy --target="$ENGINE_CANARY_TARGET" --yes --scope blazity --token "$VERCEL_TOKEN")"
          echo "$deployment_output"
          url="$(echo "$deployment_output" | awk 'NF { value=$0 } END { print value }')"
          case "$url" in
            https://*) ;;
            *) echo "::error::vercel deploy did not return an HTTPS deployment URL"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          host="$(node -e 'process.stdout.write(new URL(process.argv[1]).host)' "$url")"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 300))
          until [ "$SECONDS" -ge "$deadline" ]; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$url/health" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::engine-canary deployment health did not answer HTTP 200 within 5 minutes"
          exit 1
      - name: Verify deployment and database identity
        if: steps.scope.outputs.run == 'true' && steps.target.outputs.armed == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ENGINE_CANARY_TARGET: ${{ vars.ENGINE_CANARY_TARGET }}
          ENGINE_CANARY_DB_ENV: ${{ vars.ENGINE_CANARY_DB_ENV }}
          ENGINE_CANARY_DB_FINGERPRINT: ${{ vars.ENGINE_CANARY_DB_FINGERPRINT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node --import tsx scripts/ci/engine-canary-preflight.ts --url "$URL" --target "$ENGINE_CANARY_TARGET" --commit "$GITHUB_SHA" --database-env "$ENGINE_CANARY_DB_ENV" --database-fingerprint "$ENGINE_CANARY_DB_FINGERPRINT" --database-url "$DATABASE_URL"
      - name: Run engine canaries
        if: steps.scope.outputs.run == 'true' && steps.target.outputs.armed == 'true'
        env:
          HARNESS_CANARY_BASE_URL: ${{ steps.deploy.outputs.url }}
          HARNESS_CANARY_EXPECTED_HOST: ${{ steps.deploy.outputs.host }}
          ENGINE_CANARY_MCP_CLIENT_ID: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_ID }}
          ENGINE_CANARY_MCP_CLIENT_SECRET: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_SECRET }}
          HARNESS_CANARY_CONFIRM_PREVIEW_MUTATIONS: run-preview-harness-canary
          HARNESS_CANARY_CLAUDE_WORKFLOW_ID: ${{ vars.HARNESS_CANARY_CLAUDE_WORKFLOW_ID }}
          HARNESS_CANARY_CODEX_WORKFLOW_ID: ${{ vars.HARNESS_CANARY_CODEX_WORKFLOW_ID }}
          HARNESS_CANARY_CUSTOM_WORKFLOW_ID: ${{ vars.HARNESS_CANARY_CUSTOM_WORKFLOW_ID }}
          HARNESS_CANARY_TICKET_KEY: ${{ vars.HARNESS_CANARY_TICKET_KEY }}
          HARNESS_CANARY_CUSTOM_PROFILE_ID: ${{ vars.HARNESS_CANARY_CUSTOM_PROFILE_ID }}
          HARNESS_CANARY_CUSTOM_PROFILE_VERSION: ${{ vars.HARNESS_CANARY_CUSTOM_PROFILE_VERSION }}
          HARNESS_CANARY_CUSTOM_SKILL_ARTIFACT_HASH: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_ARTIFACT_HASH }}
          HARNESS_CANARY_CUSTOM_SKILL_NAME: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_NAME }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_OWNER: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_OWNER }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_REPOSITORY: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_REPOSITORY }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_PATH: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_PATH }}
          HARNESS_CANARY_CUSTOM_SKILL_SOURCE_COMMIT_SHA: ${{ vars.HARNESS_CANARY_CUSTOM_SKILL_SOURCE_COMMIT_SHA }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VERCEL_ENV: preview
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED: ${{ vars.NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED }}
          HARNESS_CANARY_TIMEOUT_MS: ${{ vars.HARNESS_CANARY_TIMEOUT_MS }}
          REPLAY_CANARY_LOG_EXPORT_PATH: ${{ vars.REPLAY_CANARY_LOG_EXPORT_PATH }}
          REPLAY_CANARY_LOG_WAIT_MS: ${{ vars.REPLAY_CANARY_LOG_WAIT_MS }}
          REPLAY_CANARY_LOG_SETTLE_MS: ${{ vars.REPLAY_CANARY_LOG_SETTLE_MS }}
          REPLAY_CANARY_LOG_MAX_BYTES: ${{ vars.REPLAY_CANARY_LOG_MAX_BYTES }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          : > "$REPLAY_CANARY_LOG_EXPORT_PATH"
          stream_logs() {
            while true; do
              npx --yes vercel@56.4.1 logs "$HARNESS_CANARY_BASE_URL" --follow --json --scope blazity --token "$VERCEL_TOKEN" >> "$REPLAY_CANARY_LOG_EXPORT_PATH" 2>&1 || true
              sleep 1
            done
          }
          stream_logs &
          log_stream_pid=$!
          trap 'kill "$log_stream_pid" 2>/dev/null || true' EXIT
          pnpm --filter worker test:e2e:replay

  # The one check branch protection requires (ADR-004). It has to reach a
  # verdict on every pull request, so three things about it are load bearing.
  # `always()`: without it a failed or cancelled source job would leave this job
  # skipped, and GitHub reads a skipped required check as satisfied. The
  # per-job result check below: the log has to name which job was not green,
  # not just that something was not. And no `paths:` or `paths-ignore:` filter
  # may stand between a pull request and this workflow: a filtered-out workflow
  # never creates its check runs, and a required check that is never created
  # leaves the pull request on a permanent "Expected". Path filtering belongs
  # on the expensive jobs behind this one, never on the trigger or on this job.
  ci:
    needs: [source-checks, unit-worker, unit-dashboard, workflow-sdk, engine-canary]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source job to have succeeded
        run: |
          set -euo pipefail
          failed=""
          for entry in \
            "source-checks:${{ needs.source-checks.result }}" \
            "unit-worker:${{ needs.unit-worker.result }}" \
            "unit-dashboard:${{ needs.unit-dashboard.result }}" \
            "workflow-sdk:${{ needs.workflow-sdk.result }}" \
            "engine-canary:${{ needs.engine-canary.result }}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "$name: $result"
            # Fork pull requests must never reach the secret-bearing `e2e` environment.
            if [ "$name" = "engine-canary" ] && [ "$result" = "skipped" ] && { [ "${{ github.event_name }}" != "pull_request" ] || [ "${{ github.event.pull_request.head.repo.fork }}" = "true" ]; }; then
              continue
            fi
            if [ "$result" != "success" ]; then
              echo "::error::source job '$name' reported '$result'"
              failed="$failed $name"
            fi
          done
          # `needs.*.result` is the count guard: a job added to `needs:` above
          # without a line in the loop would otherwise go unchecked here.
          declared=$(echo "${{ join(needs.*.result, ' ') }}" | wc -w | tr -d ' ')
          if [ "$declared" != "5" ]; then
            echo "::error::ci needs $declared jobs but checks 5 by name"
            failed="$failed needs-list"
          fi
          if [ -n "$failed" ]; then
            echo "::error::ci is red because of:$failed"
            exit 1
          fi
          echo "every source job succeeded"

# The three e2e suites used to be duplicated here behind
# `if: merge_group || workflow_dispatch`. They never ran: `main` carries no
# protection and no rulesets, so there is no merge queue and `merge_group`
# cannot fire, and the dispatch path duplicated `e2e.yml`'s own dispatch
# without its tier selector. The two copies had already drifted apart (this
# one carried a JIRA_E2E_COMMENTER_TOKEN the other lacked), which is the
# usual end of a duplicated job. They live in `.github/workflows/e2e.yml`
# alone now, where they also run nightly.
#
# The `on:` triggers above are deliberately unchanged: `merge_group` still
# runs the source gate, which is what a merge queue would want from it.
