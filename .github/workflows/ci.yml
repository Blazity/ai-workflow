name: CI

on:
  pull_request:
    branches: [main, dev]
  # Without this, nothing ever ran on main: every recorded run came from a
  # pull request, so the branch the releases are cut from had no signal of its
  # own and a merge could land red without anything turning red afterwards.
  # Pull-request runs test the merge commit against the base at open time, not
  # what main actually became, so they are not a substitute.
  push:
    branches: [main]
  merge_group:
  # The e2e suites below are gated on the merge queue, and no merge queue is
  # configured, so they had never run: 11 of 11 recorded runs skipped all three.
  # A manual dispatch is the only way to exercise them without changing how
  # merges work, and their secrets live in the `e2e` environment, which is
  # reachable from Actions and nowhere else.
  workflow_dispatch:

concurrency:
  # Pull-request updates supersede stale checks from the same head branch.
  # Pushes retain an exact-SHA verdict, while merge-queue and manual runs use a
  # unique run/attempt suffix so this outer cancellation can never terminate a
  # secret-bearing E2E job. The E2E jobs have their own cross-workflow queue.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'push' && github.sha || (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && format('{0}-{1}', github.run_id, github.run_attempt) || 'shared' }}
  cancel-in-progress: true

jobs:
  # The source gate is four independent jobs so its verdict arrives in minutes
  # instead of at the end of a serial half hour, plus one aggregate job named
  # `ci` so branch protection still has a single check to require.
  #
  # Every job below builds from the checkout alone. None of them may carry
  # secrets, an `if:`, or `continue-on-error`: a source gate that can be skipped
  # or that can reach a live environment is not a gate.
  # `scripts/ci/ci-workflow.test.ts` holds that line for all of them.
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 to match local dev and the Vercel runtime: the dashboard
          # test script relies on node --test glob patterns (Node 21+).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run test:release-notes
      - run: pnpm run test:ci
      - run: pnpm run build:ci

  # 384 worker test files, each paying its own process and module startup, so
  # sharding buys wall-clock that the suite itself cannot give back.
  unit-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports. Stopping the others on the first red hides how
      # much is broken behind whichever shard happened to fail first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter worker run build:shared
      # `pnpm run <script> -- --shard=...` does not reach vitest through the
      # script's own `&&` chain: it ran all 386 files. Invoke the binary.
      - run: pnpm --filter worker exec vitest run --shard=${{ matrix.shard }}/4

  # The dashboard runs on node --test, which vitest sharding cannot cover, so it
  # earns its own job rather than sitting on another job's critical path.
  unit-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ai-workflow-dashboard run test

  # Durable-workflow tests. They need their own Workflow SDK builder config,
  # so vitest.config.ts cannot pick them up alongside the rest of the suite.
  workflow-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workflow-sdk

  # The one check branch protection requires. `always()` is deliberate: without
  # it a failed or cancelled source job would leave this job skipped, and GitHub
  # reads a skipped required check as satisfied, which is the single outcome
  # this job exists to prevent.
  ci:
    needs: [source-checks, unit-worker, unit-dashboard, workflow-sdk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source job to have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "source job results: $results"
          for result in $results; do
            if [ "$result" != "success" ]; then
              echo "::error::a source job reported '$result'"
              exit 1
            fi
          done

  e2e-orchestration:
    needs: [ci]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: aiw-e2e-${{ github.repository_id }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    environment: e2e
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
      JIRA_E2E_COMMENTER_TOKEN: ${{ secrets.JIRA_E2E_COMMENTER_TOKEN }}
      COLUMN_AI: ${{ secrets.COLUMN_AI }}
      COLUMN_AI_REVIEW: ${{ secrets.COLUMN_AI_REVIEW }}
      COLUMN_BACKLOG: ${{ secrets.COLUMN_BACKLOG }}
      E2E_GITHUB_APP_ID: ${{ secrets.E2E_GITHUB_APP_ID }}
      E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.E2E_GITHUB_APP_PRIVATE_KEY }}
      E2E_GITHUB_INSTALLATION_ID: ${{ secrets.E2E_GITHUB_INSTALLATION_ID }}
      E2E_GITHUB_OWNER: ${{ secrets.E2E_GITHUB_OWNER }}
      E2E_GITHUB_REPO: ${{ secrets.E2E_GITHUB_REPO }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MAX_CONCURRENT_AGENTS: ${{ secrets.MAX_CONCURRENT_AGENTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify required e2e secrets present
        run: |
          : "${DATABASE_URL:?DATABASE_URL missing in e2e environment — must be the Neon branch the deployment under test (ai-workflow-demo) uses}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN missing in e2e environment}"
          : "${VERCEL_TEAM_ID:?VERCEL_TEAM_ID missing in e2e environment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID missing in e2e environment}"
      - name: Preflight — verify e2e DATABASE_URL is the migrated branch
        working-directory: apps/worker
        run: pnpm exec tsx e2e/scripts/check-db.ts
      - run: pnpm run test:e2e:orchestration
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-orchestration-results
          path: |
            apps/worker/e2e/**/*.log
          retention-days: 7

  e2e-capacity:
    needs: [e2e-orchestration]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: aiw-e2e-${{ github.repository_id }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    environment: e2e
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
      JIRA_E2E_COMMENTER_TOKEN: ${{ secrets.JIRA_E2E_COMMENTER_TOKEN }}
      COLUMN_AI: ${{ secrets.COLUMN_AI }}
      COLUMN_AI_REVIEW: ${{ secrets.COLUMN_AI_REVIEW }}
      COLUMN_BACKLOG: ${{ secrets.COLUMN_BACKLOG }}
      E2E_GITHUB_APP_ID: ${{ secrets.E2E_GITHUB_APP_ID }}
      E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.E2E_GITHUB_APP_PRIVATE_KEY }}
      E2E_GITHUB_INSTALLATION_ID: ${{ secrets.E2E_GITHUB_INSTALLATION_ID }}
      E2E_GITHUB_OWNER: ${{ secrets.E2E_GITHUB_OWNER }}
      E2E_GITHUB_REPO: ${{ secrets.E2E_GITHUB_REPO }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MAX_CONCURRENT_AGENTS: ${{ secrets.MAX_CONCURRENT_AGENTS }}
      E2E_CAPACITY_CAMPAIGN_ID: ${{ github.repository_id }}:${{ github.run_id }}:${{ github.run_attempt }}:e2e-capacity
      E2E_CAPACITY_RELEASE_MARKER: ${{ github.workspace }}/.aiw-capacity-release-${{ github.run_id }}-${{ github.run_attempt }}.json
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify required e2e secrets present
        run: |
          : "${DATABASE_URL:?DATABASE_URL missing in e2e environment — must be the Neon branch the deployment under test (ai-workflow-demo) uses}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN missing in e2e environment}"
          : "${VERCEL_TEAM_ID:?VERCEL_TEAM_ID missing in e2e environment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID missing in e2e environment}"
      - name: Preflight — verify e2e DATABASE_URL is the migrated branch
        working-directory: apps/worker
        run: pnpm exec tsx e2e/scripts/check-db.ts
      - name: Run capacity E2E
        timeout-minutes: 30
        run: pnpm run test:e2e:capacity
      - name: Finalize capacity reservations
        if: always()
        timeout-minutes: 10
        working-directory: apps/worker
        run: pnpm exec tsx e2e/scripts/finalize-capacity.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-capacity-results
          path: |
            apps/worker/e2e/**/*.log
          retention-days: 7

  e2e-agent:
    needs: [e2e-capacity]
    if: github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: aiw-e2e-${{ github.repository_id }}
      cancel-in-progress: false
      queue: max
    timeout-minutes: 120
    environment: e2e
    env:
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_PROJECT_KEY: ${{ secrets.JIRA_PROJECT_KEY }}
      JIRA_WEBHOOK_SECRET: ${{ secrets.JIRA_WEBHOOK_SECRET }}
      JIRA_E2E_COMMENTER_TOKEN: ${{ secrets.JIRA_E2E_COMMENTER_TOKEN }}
      COLUMN_AI: ${{ secrets.COLUMN_AI }}
      COLUMN_AI_REVIEW: ${{ secrets.COLUMN_AI_REVIEW }}
      COLUMN_BACKLOG: ${{ secrets.COLUMN_BACKLOG }}
      E2E_GITHUB_APP_ID: ${{ secrets.E2E_GITHUB_APP_ID }}
      E2E_GITHUB_APP_PRIVATE_KEY: ${{ secrets.E2E_GITHUB_APP_PRIVATE_KEY }}
      E2E_GITHUB_INSTALLATION_ID: ${{ secrets.E2E_GITHUB_INSTALLATION_ID }}
      E2E_GITHUB_OWNER: ${{ secrets.E2E_GITHUB_OWNER }}
      E2E_GITHUB_REPO: ${{ secrets.E2E_GITHUB_REPO }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      MAX_CONCURRENT_AGENTS: ${{ secrets.MAX_CONCURRENT_AGENTS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify required e2e secrets present
        run: |
          : "${DATABASE_URL:?DATABASE_URL missing in e2e environment — must be the Neon branch the deployment under test (ai-workflow-demo) uses}"
          : "${VERCEL_TOKEN:?VERCEL_TOKEN missing in e2e environment}"
          : "${VERCEL_TEAM_ID:?VERCEL_TEAM_ID missing in e2e environment}"
          : "${VERCEL_PROJECT_ID:?VERCEL_PROJECT_ID missing in e2e environment}"
      - name: Preflight — verify e2e DATABASE_URL is the migrated branch
        working-directory: apps/worker
        run: pnpm exec tsx e2e/scripts/check-db.ts
      - run: pnpm run test:e2e:agent
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-agent-results
          path: |
            apps/worker/e2e/**/*.log
          retention-days: 7
