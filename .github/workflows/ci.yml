name: CI

on:
  pull_request:
    branches: [main, dev]
  # Without this, nothing ever ran on main: every recorded run came from a
  # pull request, so the branch the releases are cut from had no signal of its
  # own and a merge could land red without anything turning red afterwards.
  # Pull-request runs test the merge commit against the base at open time, not
  # what main actually became, so they are not a substitute.
  push:
    branches: [main]
  merge_group:
  # Kept so the source gate can be re-run by hand on a branch, which is the
  # only thing this workflow does now: the e2e suites it used to carry live in
  # `e2e.yml`, and the note above the jobs says why.
  workflow_dispatch:

concurrency:
  # Pull-request updates supersede stale checks from the same head branch.
  # Pushes retain an exact-SHA verdict, while merge-queue and manual runs use a
  # unique run/attempt suffix so this outer cancellation can never terminate a
  # secret-bearing E2E job. The E2E jobs have their own cross-workflow queue.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}-${{ github.event_name == 'push' && github.sha || (github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group') && format('{0}-{1}', github.run_id, github.run_attempt) || 'shared' }}
  cancel-in-progress: true

jobs:
  # The source gate is four independent jobs so its verdict arrives in minutes
  # instead of at the end of a serial half hour, plus one aggregate job named
  # `ci` so branch protection still has a single check to require.
  #
  # Every job below builds from the checkout alone. None of them may carry
  # secrets, an `if:`, or `continue-on-error`: a source gate that can be skipped
  # or that can reach a live environment is not a gate.
  # `scripts/ci/ci-workflow.test.ts` holds that line for all of them.
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 to match local dev and the Vercel runtime: the dashboard
          # test script relies on node --test glob patterns (Node 21+).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check diff whitespace
        run: |
          base="${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.event.before || '' }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No usable diff base, skipping git diff --check."
            exit 0
          fi
          git diff --check "$base...HEAD"
      - run: pnpm run typecheck
      - run: pnpm run test:release-notes
      - run: pnpm run test:ci
      - run: pnpm run gates
      - run: pnpm run build:ci

  # 384 worker test files, each paying its own process and module startup, so
  # sharding buys wall-clock that the suite itself cannot give back.
  unit-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Every shard reports. Stopping the others on the first red hides how
      # much is broken behind whichever shard happened to fail first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm run <script> -- --shard=...` does not reach vitest through the
      # script's own `&&` chain: it ran all 386 files. Invoke the binary.
      - run: pnpm --filter worker exec vitest run --shard=${{ matrix.shard }}/4

  # The dashboard runs on node --test, which vitest sharding cannot cover, so it
  # earns its own job rather than sitting on another job's critical path.
  unit-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ai-workflow-dashboard run test

  # Durable-workflow tests. They need their own Workflow SDK builder config,
  # so vitest.config.ts cannot pick them up alongside the rest of the suite.
  workflow-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:workflow-sdk

  # The one check branch protection requires (ADR-004). It has to reach a
  # verdict on every pull request, so three things about it are load bearing.
  # `always()`: without it a failed or cancelled source job would leave this job
  # skipped, and GitHub reads a skipped required check as satisfied. The
  # per-job result check below: the log has to name which job was not green,
  # not just that something was not. And no `paths:` or `paths-ignore:` filter
  # may stand between a pull request and this workflow: a filtered-out workflow
  # never creates its check runs, and a required check that is never created
  # leaves the pull request on a permanent "Expected". Path filtering belongs
  # on the expensive jobs behind this one, never on the trigger or on this job.
  ci:
    needs: [source-checks, unit-worker, unit-dashboard, workflow-sdk]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source job to have succeeded
        run: |
          failed=""
          for entry in \
            "source-checks:${{ needs.source-checks.result }}" \
            "unit-worker:${{ needs.unit-worker.result }}" \
            "unit-dashboard:${{ needs.unit-dashboard.result }}" \
            "workflow-sdk:${{ needs.workflow-sdk.result }}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            echo "$name: $result"
            if [ "$result" != "success" ]; then
              echo "::error::source job '$name' reported '$result'"
              failed="$failed $name"
            fi
          done
          # `needs.*.result` is the count guard: a job added to `needs:` above
          # without a line in the loop would otherwise go unchecked here.
          declared=$(echo "${{ join(needs.*.result, ' ') }}" | wc -w | tr -d ' ')
          if [ "$declared" != "4" ]; then
            echo "::error::ci needs $declared jobs but checks 4 by name"
            failed="$failed needs-list"
          fi
          if [ -n "$failed" ]; then
            echo "::error::ci is red because of:$failed"
            exit 1
          fi
          echo "every source job succeeded"

# The three e2e suites used to be duplicated here behind
# `if: merge_group || workflow_dispatch`. They never ran: `main` carries no
# protection and no rulesets, so there is no merge queue and `merge_group`
# cannot fire, and the dispatch path duplicated `e2e.yml`'s own dispatch
# without its tier selector. The two copies had already drifted apart (this
# one carried a JIRA_E2E_COMMENTER_TOKEN the other lacked), which is the
# usual end of a duplicated job. They live in `.github/workflows/e2e.yml`
# alone now, where they also run nightly.
#
# The `on:` triggers above are deliberately unchanged: `merge_group` still
# runs the source gate, which is what a merge queue would want from it.
