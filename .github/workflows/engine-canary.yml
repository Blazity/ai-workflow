name: Engine canary

# The engine canary: real workflow runs on the demo deployment, which shares
# production's database. It is NOT a required check and `ci` does not wait for
# it (ADR-004, change log 2026-09-23). It costs real model spend on every run,
# so it starts only when somebody asks:
#
# - a pull request labelled `run-canary` (adding the label starts it, and every
#   later push to that pull request runs it again while the label stays);
# - `workflow_dispatch`, where `cases: all` also runs the built-in Claude and
#   Codex cases.
#
# Add the label to a pull request that changes engine steps, moves or renames a
# "use step" file, changes a workflow body, or upgrades the Workflow DevKit.
on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      cases:
        description: "custom runs the one Haiku case; all adds the built-in Claude (Opus) and Codex cases"
        type: choice
        options: [custom, all]
        default: custom

jobs:
  # Refuses a change that carries a database migration: the canary target
  # (demo) shares the production database, and deploying it runs the
  # migration there. Its own job, outside the canary's queue, and it reads no
  # secret. It runs only when somebody asked for the canary.
  engine-canary-scope:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'run-canary') &&
      (github.event.action != 'labeled' || github.event.label.name == 'run-canary'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      migrations: ${{ steps.scope.outputs.migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Select engine canary scope
        id: scope
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || 'main' }}
        run: node --import tsx scripts/ci/engine-canary-scope.ts --base "origin/$BASE_REF" --head HEAD
      - name: Skip pull request migrations
        if: steps.scope.outputs.migrations == 'true'
        run: |
          set -euo pipefail
          echo "::warning title=engine-canary skipped::the change carries a database migration; the canary target shares the production database, so it runs after merge only"
          exit 0

  # Fork pull requests never reach the secret-bearing `e2e` environment: the
  # scope job only starts for a same-repository pull request, and this job
  # needs it to have succeeded.
  engine-canary:
    needs: [engine-canary-scope]
    if: needs.engine-canary-scope.result == 'success' && needs.engine-canary-scope.outputs.migrations != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 95
    environment: e2e
    # Repository-wide, not per pull request: the three fixture tickets are
    # shared across every run of this job, so two pull requests running the
    # canary at once would collide on them. cancel-in-progress stays false so
    # a second pull request queues behind the first instead of cancelling it
    # or racing it onto the same tickets. Only runs somebody asked for reach
    # this queue.
    concurrency:
      group: engine-canary-shared-fixtures
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 to match local dev and the Vercel runtime: the dashboard
          # test script relies on node --test glob patterns (Node 21+).
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate engine canary target configuration
        id: target
        env:
          ENGINE_CANARY_TARGET: ${{ vars.ENGINE_CANARY_TARGET }}
          ENGINE_CANARY_TARGET_URL: ${{ vars.ENGINE_CANARY_TARGET_URL }}
          ENGINE_CANARY_DB_ENV: ${{ vars.ENGINE_CANARY_DB_ENV }}
          ENGINE_CANARY_DB_FINGERPRINT: ${{ vars.ENGINE_CANARY_DB_FINGERPRINT }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          ENGINE_CANARY_MCP_CLIENT_ID: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_ID }}
          ENGINE_CANARY_MCP_CLIENT_SECRET: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_SECRET }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED: ${{ vars.NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED }}
          HARNESS_CANARY_TIMEOUT_MS: ${{ vars.HARNESS_CANARY_TIMEOUT_MS }}
          REPLAY_CANARY_LOG_WAIT_MS: ${{ vars.REPLAY_CANARY_LOG_WAIT_MS }}
          REPLAY_CANARY_LOG_MAX_BYTES: ${{ vars.REPLAY_CANARY_LOG_MAX_BYTES }}
        run: |
          set -euo pipefail
          if [ "$ENGINE_CANARY_TARGET" = "production" ]; then
            echo "::error title=engine-canary configuration::the Vercel production target is forbidden"
            exit 1
          fi
          # This job starts only when somebody asked for the canary, so every
          # path that reaches this line wants it. An unconfigured target is
          # therefore a refusal, not an idle state: a green job that ran no
          # behavioural gate would read as a canary that passed.
          if [ -z "$ENGINE_CANARY_TARGET" ]; then
            echo "::error title=engine-canary unconfigured::repository variable ENGINE_CANARY_TARGET is empty, so the behavioural gate did not run and this job proves nothing about this change. The job only starts when somebody asked for the canary, so an unconfigured target is a refusal, not an idle state. Set ENGINE_CANARY_TARGET to the Vercel custom target the canary deploys to."
            exit 1
          fi
          required=(
            ENGINE_CANARY_TARGET_URL
            ENGINE_CANARY_DB_ENV
            ENGINE_CANARY_DB_FINGERPRINT
            VERCEL_TOKEN
            VERCEL_ORG_ID
            VERCEL_PROJECT_ID
            ENGINE_CANARY_MCP_CLIENT_ID
            ENGINE_CANARY_MCP_CLIENT_SECRET
            VERCEL_AUTOMATION_BYPASS_SECRET
            NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED
            HARNESS_CANARY_TIMEOUT_MS
            REPLAY_CANARY_LOG_WAIT_MS
            REPLAY_CANARY_LOG_MAX_BYTES
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error title=engine-canary configuration::missing required names: ${missing[*]}"
            exit 1
          fi
          target_host="$(
            node -e '
              const value = process.argv[1];
              let url;
              try {
                url = new URL(value);
              } catch {
                process.exit(1);
              }
              if (
                !value.startsWith("https://") ||
                value !== url.origin ||
                url.hostname === "ai-workflow-app-eight.vercel.app"
              ) {
                process.exit(1);
              }
              process.stdout.write(url.host);
            ' "$ENGINE_CANARY_TARGET_URL"
          )" || {
            echo "::error title=engine-canary configuration::ENGINE_CANARY_TARGET_URL must be an HTTPS origin without a path and must not use ai-workflow-app-eight.vercel.app"
            exit 1
          }
          echo "host=$target_host" >> "$GITHUB_OUTPUT"
      - name: Deploy engine canary target
        id: deploy
        env:
          ENGINE_CANARY_TARGET: ${{ vars.ENGINE_CANARY_TARGET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deployment_output="$(npx --yes vercel@56.4.1 deploy --target="$ENGINE_CANARY_TARGET" --yes --scope blazity --token "$VERCEL_TOKEN")"
          echo "$deployment_output"
          url="$(echo "$deployment_output" | awk 'NF { value=$0 } END { print value }')"
          case "$url" in
            https://*) ;;
            *) echo "::error::vercel deploy did not return an HTTPS deployment URL"; exit 1 ;;
          esac
          echo "url=$url" >> "$GITHUB_OUTPUT"
          deadline=$((SECONDS + 300))
          until [ "$SECONDS" -ge "$deadline" ]; do
            status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$url/health" || true)"
            if [ "$status" = "200" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::engine-canary deployment health did not answer HTTP 200 within 5 minutes"
          exit 1
      - name: Verify deployment and database identity
        env:
          URL: ${{ vars.ENGINE_CANARY_TARGET_URL }}
          ENGINE_CANARY_TARGET: ${{ vars.ENGINE_CANARY_TARGET }}
          ENGINE_CANARY_DB_ENV: ${{ vars.ENGINE_CANARY_DB_ENV }}
          ENGINE_CANARY_DB_FINGERPRINT: ${{ vars.ENGINE_CANARY_DB_FINGERPRINT }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          while true; do
            if node --import tsx scripts/ci/engine-canary-preflight.ts --url "$URL" --target "$ENGINE_CANARY_TARGET" --commit "$GITHUB_SHA" --database-env "$ENGINE_CANARY_DB_ENV" --database-fingerprint "$ENGINE_CANARY_DB_FINGERPRINT"; then
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::engine-canary target alias did not report commit $GITHUB_SHA within 5 minutes"
              exit 1
            fi
            sleep 10
          done
      - name: Run engine canaries
        env:
          HARNESS_CANARY_BASE_URL: ${{ vars.ENGINE_CANARY_TARGET_URL }}
          HARNESS_CANARY_EXPECTED_HOST: ${{ steps.target.outputs.host }}
          # The canary queries runtime logs for the unique deployment URL, not
          # the alias: an alias answers for whichever deployment currently holds
          # it, which is not necessarily the one this job just verified.
          ENGINE_CANARY_LOG_SOURCE_URL: ${{ steps.deploy.outputs.url }}
          ENGINE_CANARY_MCP_CLIENT_ID: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_ID }}
          ENGINE_CANARY_MCP_CLIENT_SECRET: ${{ secrets.ENGINE_CANARY_MCP_CLIENT_SECRET }}
          HARNESS_CANARY_CONFIRM_PREVIEW_MUTATIONS: run-preview-harness-canary
          VERCEL_ENV: preview
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED: ${{ vars.NEXT_PUBLIC_HARNESS_PROFILE_AUTHORING_ENABLED }}
          HARNESS_CANARY_TIMEOUT_MS: ${{ vars.HARNESS_CANARY_TIMEOUT_MS }}
          REPLAY_CANARY_LOG_WAIT_MS: ${{ vars.REPLAY_CANARY_LOG_WAIT_MS }}
          REPLAY_CANARY_LOG_MAX_BYTES: ${{ vars.REPLAY_CANARY_LOG_MAX_BYTES }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          # One cheap case by default (the custom Haiku profile, which also
          # carries the replay leg); `all` adds the built-in Claude (Opus) and
          # Codex cases, from the workflow_dispatch input only.
          ENGINE_CANARY_CASES: ${{ github.event_name == 'workflow_dispatch' && inputs.cases || 'custom' }}
        run: |
          set -euo pipefail
          pnpm --filter worker test:e2e:replay
